<script>
function esc(s) {
	return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function relTime(iso) {
	var d = new Date(iso);
	if (isNaN(d)) return '';
	var m = Math.floor((Date.now() - d.getTime()) / 60000);
	if (m < 1) return '刚刚';
	if (m < 60) return m + ' 分钟前';
	var h = Math.floor(m / 60);
	if (h < 24) return h + ' 小时前';
	return Math.floor(h / 24) + ' 天前';
}

function shortTime(iso) {
	if (!iso) return '—';
	var d = new Date(iso);
	if (isNaN(d)) return '—';
	var p = n => (n < 10 ? '0' : '') + n;
	return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

window.copy = function(btn, path) {
	var full = /^https?:/i.test(path) ? path : location.origin + (path.charAt(0) === '/' ? '' : '/') + path;
	var done = function() { btn.classList.remove('success'); btn.textContent = '复制链接'; };
	var ok = function() { btn.classList.add('success'); btn.textContent = '复制成功'; setTimeout(done, 1500); };
	if (navigator.clipboard && navigator.clipboard.writeText) {
		navigator.clipboard.writeText(full).then(ok, fallback);
	} else { fallback(); }
	function fallback() {
		var ta = document.createElement('textarea');
		ta.value = full; document.body.appendChild(ta); ta.select();
		try { if (document.execCommand('copy')) ok(); else prompt('复制链接', full); }
		catch (e) { prompt('复制链接', full); }
		document.body.removeChild(ta);
	}
};

function buildRow(s) {
	var path = 'data/raw/' + s.file;
	var tr = document.createElement('tr');
	if (!s.active) tr.className = 'off';
	tr.innerHTML =
		'<td class="src"><span class="dot' + (s.active ? '' : ' off') + '"></span>' + esc(s.label) +
			(s.active ? '<span class="tag">' + esc(s.entries) + ' 条</span>' : '') + '</td>' +
		'<td><span class="code">' + esc(s.code || '--') + '</span></td>' +
		'<td><a class="url-text" href="' + esc(path) + '" target="_blank" rel="noopener">' + esc(path) + '</a></td>' +
		'<td class="time">' + shortTime(s.last_updated) + '<small>' + (s.last_updated ? esc(relTime(s.last_updated)) : '暂无数据') + '</small></td>' +
		'<td><button class="copy-btn" onclick="copy(this,\'' + esc(path) + '\')">复制链接</button></td>';
	return tr;
}

fetch('data/sources.json', { cache: 'no-store' })
	.then(function(r) { return r.json(); })
	.then(function(meta) {
		var tb = document.getElementById('tb');
		tb.innerHTML = '';
		var rows = meta.sources || [];
		var active = rows.filter(function(s) { return s.active; });
		var rest = rows.filter(function(s) { return !s.active; });
		active.concat(rest).forEach(function(s) { tb.appendChild(buildRow(s)); });
		if (!rows.length) {
			tb.innerHTML = '<tr><td colspan="5" class="loading">暂无数据，请在仓库 Actions 中手动触发一次工作流</td></tr>';
		}
		document.getElementById('summary').innerHTML =
			'活跃上游 <b>' + active.length + '</b> / ' + rows.length +
			' · 去重后 <b>' + (meta.total_entries || 0) + '</b> 条' +
			' · 最近更新 <b>' + shortTime(meta.generated_at) + '</b>';
	})
	.catch(function() {
		document.getElementById('tb').innerHTML = '<tr><td colspan="5" class="loading">sources.json 加载失败，请确认已完成首次数据生成</td></tr>';
		document.getElementById('summary').textContent = '数据暂不可用';
	});
</script>
