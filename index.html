<script>
function copyText(text, btn) {
  const done = () => { btn.textContent = "✅ 已复制"; setTimeout(() => btn.textContent = "复制", 1500); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done);
  } else {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove(); done();
  }
}

function makeCopyBtn(path) {
  const btn = document.createElement("button");
  btn.className = "copy"; btn.textContent = "复制";
  btn.onclick = () => copyText(location.origin + "/" + path, btn);
  return btn;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function loadMeta() {
  try {
    const res = await fetch("data/sources.json", { cache: "no-store" });
    const meta = await res.json();
    const tb = document.getElementById("tb-src");
    tb.innerHTML = "";
    const active = meta.sources.filter(s => s.active);
    if (!active.length) {
      tb.innerHTML = `<tr><td colspan="4" class="loading err">暂无活跃上游，请确认已触发工作流生成数据</td></tr>`;
      return;
    }
    active.forEach(s => {
      const time = s.last_updated
        ? String(s.last_updated).slice(5, 16).replace("T", " ")
        : "-";
      const tr = document.createElement("tr");
      const nameTd = document.createElement("td");
      nameTd.innerHTML = `<b>${esc(s.label)}</b><span class="tag">${s.entries} 条</span>`;

      const linkTd = document.createElement("td");
      linkTd.className = "link";
      const a = document.createElement("a");
      a.href = "data/raw/" + s.file;
      a.textContent = "data/raw/" + s.file;
      linkTd.appendChild(a);

      const timeTd = document.createElement("td");
      timeTd.className = "time";
      timeTd.textContent = time;

      const opTd = document.createElement("td");
      opTd.appendChild(makeCopyBtn("data/raw/" + s.file));

      tr.append(nameTd, linkTd, timeTd, opTd);
      tb.appendChild(tr);
    });
  } catch (e) {
    document.getElementById("tb-src").innerHTML =
      `<tr><td colspan="4" class="loading err">sources.json 加载失败，请确认已部署并完成首次数据生成</td></tr>`;
  }
}

loadMeta();
</script>
