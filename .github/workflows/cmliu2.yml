name: Update CM 2

on:
  schedule:
    # 每 3 小时抓取一次本上游（UTC），与其他上游错开
    - cron: "19 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qnair-cmliu2
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests cloudscraper beautifulsoup4

      - name: Fetch CM 2
        run: python scripts/fetch.py cmliu2

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交。"
          else
            git commit -m "CM 2 数据更新 $(TZ='Asia/Shanghai' date +'%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
