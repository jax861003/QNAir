name: Update QNAir

on:
  schedule:
    # 每 3 小时运行一次（UTC 时间），上游分 3 组轮流实抓
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "强制更新全部上游（忽略轮换）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: qnair-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests cloudscraper beautifulsoup4

      - name: Fetch & Merge
        env:
          # 订阅型上游的地址放在仓库 Secrets 中，未配置的会被自动跳过
          CMLIU_URL: ${{ secrets.CMLIU_URL }}
          CMLIU2_URL: ${{ secrets.CMLIU2_URL }}
          LUOLI_URL: ${{ secrets.LUOLI_URL }}
          LZJ_URL: ${{ secrets.LZJ_URL }}
          XINYITANG3_URL: ${{ secrets.XINYITANG3_URL }}
          # 轮换抓取：13 个上游分 3 组，每轮实抓一组，其余沿用缓存
          QNAIR_ROTATE_GROUPS: "3"
          # 手动触发时可勾选 full 强制全部实抓
          QNAIR_FORCE_ALL: ${{ github.event.inputs.full == 'true' && '1' || '0' }}
        run: python scripts/update.py

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交。"
          else
            BJ_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M:%S')
            git commit -m "QNAir 数据更新 $BJ_TIME"
            git pull --rebase origin main
            git push
          fi
